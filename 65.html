<html>

<head>
    <link rel = "stylesheet" type = text/css href = "style.css">

</head>

<body>
    <table border = "1">
        <tr>
            <td colspan="4">
                <input type = "text" id = "inputBox"value = "0"/>
            </td>
        </tr>

        <tr>
            <td class = "digitBtn" onclick= digitButton(7)">7</td>
            <td class = "digitBtn" onclick="digitButton(8)">8</td>
            <td class = "digitBtn"onclick="digitButton(9)">9</td>
            <td class = "Operator"onclick = "operatorBtn('*')">x</td>
        </tr>

         <tr>
            <td class = "digitBtn" onclick ="digitButton(4)">4</td>
            <td class = "digitBtn" onclick ="digitButton(5)">5</td>
            <td class = "digitBtn"onclick ="digitButton(6)">6</td>
            <td class = "Operator"onclick = "operatorBtn('-')" >-</td>
        </tr>

         <tr>
            <td class = "digitBtn" onclick ="digitButton(1)">1</td>
            <td class = "digitBtn" onclick ="digitButton(2)">2</td>
            <td class = "digitBtn" onclick ="digitButton(3)">3</td>
            <td class = "Operator" onclick = "operatorBtn('+')">+</td>
        </tr>

        <tr>
            <td class = "digitBtn" onclick ="digitButton(0)" colspan = "2">0</td>
            <td class = "ACdecor"onclick ="btnACPressed()"> AC </td>
            <td class = "Operator" onclick = "operatorBtn('/')">/</td>
        </tr>

        <tr>
            <td class = "Operator" colspan = "4" onclick ="equalBtn()" >=</td>
        </tr>


    </table>
    <script>

        var newLine = true; //Boolean variable dtermines if next thing said should be on a new line
        var value1;
        var currentOperator;
//Event handler for when a button is pressed
        function digitButton(button){

            if(newLine){
                document.getElementById("inputBox").value = button;
                newLine = false;
            }else{
               var currentValue = document.getElementById("inputBox").value;
            document.getElementById("inputBox").value = currentValue + button;
             }
 
        }

        function btnACPressed(){
            document.getElementById("inputBox").value = 0;
            newLine = true
        }

        function operatorBtn(operator){
            currentOperator = operator;
            value1 = parseInt(document.getElementById("inputBox").value);
            newLine = true
        }

        //event handler for equal button

        function equalBtn(){
            var value2 = parseInt(document.getElementById("inputBox").value);
            var finalTotal;

            switch(currentOperator){
                case "+" :
                    finalTotal = value1 + value2
                    break;
                case "-" :
                    finalTotal = value1 - value2
                    break;
                case "*" :
                    finalTotal = value1 * value2
                    break;
                case "/" :
                    finalTotal = value1 / value2
                    break;
            }
            document.getElementById("inputBox").value = finalTotal

            value1 = 0;
            newLine = true
        }
    </script>
</html>
